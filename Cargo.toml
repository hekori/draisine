[package]
name = "draisine"
version = "0.1.0"
edition = "2024"
description = "Portable tray app for safe rclone sync (diff, 1-way, 2-way) between a local folder and a cloud remote"
license = "MIT"
repository = "https://github.com/hekori/draisine"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6"
trash = "5"
open = "5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
notify-rust = "4"
rfd = "0.18"
gethostname = "1"

tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
png = "0.18"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
