name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu = broadest glibc compatibility for the Linux binary.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install rclone (for the end-to-end test)
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then curl -fsSL https://rclone.org/install.sh | sudo bash
          elif [[ "$RUNNER_OS" == "macOS" ]]; then brew install rclone
          else choco install rclone -y; fi
      - name: Unit tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}
      - name: End-to-end test (Linux)
        if: runner.os == 'Linux'
        run: cargo test --target ${{ matrix.target }} -- --ignored --test-threads=1
      - name: Package
        env:
          DRAISINE_DROPBOX_APP_KEY: ${{ secrets.DRAISINE_DROPBOX_APP_KEY }}
          DRAISINE_DROPBOX_APP_SECRET: ${{ secrets.DRAISINE_DROPBOX_APP_SECRET }}
        run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: draisine-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
